services:
  yolov5-rknn:
    build: .
    environment:
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
    shm_size: '8gb'
    volumes:
      - .:/workspace

  # GPU-enabled variant. Requires the NVIDIA Container Toolkit on the host.
  # Builds with CUDA-enabled dependencies and reserves all available GPUs.
  yolov5-rknn-gpu:
    build:
      context: .
      args:
        REQUIREMENTS: python/requirements.gpu.txt
    environment:
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    shm_size: '8gb'
    volumes:
      - .:/workspace
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
